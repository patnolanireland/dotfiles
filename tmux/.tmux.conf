# Renumber windows
set -g renumber-windows on

set-option -g default-shell /bin/zsh

if-shell -b 'uname -s | grep -q Darwin' 'set-option -g default-command "reattach-to-user-namespace -l zsh"'

# Enable RGB colour if running in xterm(1)
set-option -sa terminal-overrides ",xterm*:Tc"

# Change the default $TERM to tmux-256color
set -g default-terminal "tmux-256color"

# No bells at all
set -g bell-action none

# Change the prefix key to C-a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

######################
#### Key Bindings ####
######################

# reload config file
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# quickly open a new window
bind N new-window

# Split window 
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# pane movement shortcuts
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -D 10


##############################
### Color & Style Settings ###
##############################

# Are now controlled via plugins

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'erikw/tmux-powerline'
set -g @plugin 'seebi/tmux-colors-solarized'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @colors-solarized 'dark'

# set vi mode for copy mode
setw -g mode-keys vi

# make copy-mode more vim-like
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer

# synchronise all panes in a window which overrides tmux-yank binding
bind u setw synchronize-panes

# Pass SSH agent to tmux sessions
set -g update-environment 'SSH_AUTH_SOCK'

# Initialise TMUX plugin manager (keep this line at the very bottome of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
